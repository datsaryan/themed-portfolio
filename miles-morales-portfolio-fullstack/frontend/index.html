<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aryan Singh | Full Stack Engineer // Earth-1610</title>
    <meta name="description" content="Portfolio of Aryan Singh - Full Stack Engineer. Specializing in Java, Spring Boot, React, PostgreSQL, Distributed Systems, and Modern Frontend Architecture." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aryan Singh | Full Stack Engineer // Spider-Man: Miles Morales Portfolio" />
    <meta property="og:description" content="Portfolio of Aryan Singh - Full Stack Engineer. Java, Spring Boot, React, Vite, Docker, PostgreSQL." />
    
    <!-- Google Fonts: Space Grotesk, Oswald, Bangers, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@400;600;700&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
      // Applies the saved palette before first paint so the light theme never
      // flashes dark on load. Mirrors src/theme/themeEngine.ts.
      (function () {
        try {
          var saved = localStorage.getItem('spider_theme');
          var light = saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>

    <style>
      /* Plain dark cover for the split second before the JS bundle loads, so
         there is no white flash. Deliberately static: no logo, no animation —
         the only animation a visitor sees is the boot cinematic itself, which
         starts from this same colour so the hand-off is invisible. */
      #ps-pre-boot { position: fixed; inset: 0; z-index: 9998; background: #05060a; }
    </style>
  </head>
  <body class="bg-void text-web font-sans antialiased selection:bg-spider selection:text-white overflow-x-hidden">
    <div id="ps-pre-boot" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove the placeholder the instant React has committed its first
      // paint (BootStage is already mounted and drawing by then, so there is
      // no gap between this disappearing and the real cinematic being visible).
      (function () {
        var remove = function () {
          var el = document.getElementById('ps-pre-boot');
          if (el && el.parentNode) el.parentNode.removeChild(el);
        };
        if ('requestIdleCallback' in window) {
          var root = document.getElementById('root');
          var mo = new MutationObserver(function () {
            if (root.childElementCount > 0) { remove(); mo.disconnect(); }
          });
          mo.observe(root, { childList: true });
          setTimeout(remove, 4000); // safety net if mount detection ever misses
        } else {
          window.addEventListener('load', remove);
        }
      })();
    </script>
  </body>
</html>
