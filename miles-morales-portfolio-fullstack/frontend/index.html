    <meta property="og:type" content="website" />

    <meta property="og:description" content="Portfolio of Aryan Singh - Full Stack Engineer. Java, Spring Boot, React, Vite, Docker, PostgreSQL." />
    
    <!-- Google Fonts: Space Grotesk, Oswald, Bangers, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@400;600;700&family=Oswald:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
      // Applies the saved palette before first paint so the light theme never
      // flashes dark on load. Mirrors src/theme/themeEngine.ts.
      (function () {
        try {
          var saved = localStorage.getItem('spider_theme');
          var light = saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>

    <!--
      Boot / rescue splash — full-bleed cinematic night-city scene. Lives
      here, in plain HTML/CSS/SVG/JS, deliberately outside the React bundle —
      it has to be able to paint and animate before /src/main.tsx has even
      finished downloading, or it can't cover the "site is slow to open"
      case at all. It resolves one of two ways:

        - React mounts (see App.tsx dispatching 'portfolio:app-ready') before
          READY_TIMEOUT_MS: the swing completes, she's caught, camera punches
          in, letterbox bars retract, whole scene fades to the real site.
        - Nothing fires within READY_TIMEOUT_MS (dead deploy, network died,
          JS failed to parse, etc.): she falls past frame, hits the ground,
          impact flash + shake, and a "failed to load" card with Retry
          takes over.

      Everything is original vector/gradient work — no imagery, no
      copyrighted character art, just stylised silhouettes rendered in the
      site's own palette.
    -->
    <style>
      #ps-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        overflow: hidden;
        background: #05060a;
        color: rgb(243 244 248);
        transition: opacity 0.6s ease;
      }
      html.light #ps-loader { color: rgb(20 20 25); }
      #ps-loader.ps-hidden { opacity: 0; pointer-events: none; }

      #ps-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: scale(1);
        animation: ps-kenburns 9s ease-out forwards;
      }
      #ps-scene svg { width: 100%; height: 100%; display: block; }
      @keyframes ps-kenburns { to { transform: scale(1.07); } }

      /* ---- grade / vignette / grain (static overlays, cheap) ---- */
      #ps-grade {
        position: absolute; inset: 0;
        background: linear-gradient(200deg, rgba(230,36,41,0.10), rgba(10,12,20,0) 45%),
                    linear-gradient(-20deg, rgba(80,140,255,0.08), rgba(10,12,20,0) 40%);
        mix-blend-mode: soft-light;
        pointer-events: none;
      }
      #ps-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
      }
      #ps-grain {
        position: absolute; inset: -10%;
        opacity: 0.05;
        pointer-events: none;
        background-image: radial-gradient(rgba(255,255,255,0.9) 0.6px, transparent 0.6px);
        background-size: 3px 3px;
        animation: ps-grain-shift 0.5s steps(4) infinite;
      }
      @keyframes ps-grain-shift {
        0% { transform: translate(0,0); } 25% { transform: translate(-1%,1%); }
        50% { transform: translate(1%,-1%); } 75% { transform: translate(-1%,-1%); }
        100% { transform: translate(0,0); }
      }

      /* ---- letterbox bars ---- */
      .ps-bar {
        position: absolute; left: 0; right: 0; height: 9%;
        background: #000; z-index: 3;
        transition: transform 0.7s cubic-bezier(0.16,1,0.3,1);
      }
      #ps-bar-top { top: 0; transform: translateY(-100%); }
      #ps-bar-bottom { bottom: 0; transform: translateY(100%); }
      #ps-loader.ps-ready #ps-bar-top,
      #ps-loader.ps-ready #ps-bar-bottom { transform: translateY(0); }
      #ps-loader.ps-hidden .ps-bar { transition: transform 0.5s ease; }
      #ps-loader.ps-hidden #ps-bar-top { transform: translateY(-100%); }
      #ps-loader.ps-hidden #ps-bar-bottom { transform: translateY(100%); }

      /* ---- sky / skyline / atmosphere ---- */
      .ps-window { animation: ps-flicker 4s ease-in-out infinite; }
      @keyframes ps-flicker {
        0%, 100% { opacity: 0.85; } 45% { opacity: 0.85; }
        50% { opacity: 0.25; } 55% { opacity: 0.85; }
      }
      .ps-cloud { animation: ps-drift 40s linear infinite; }
      @keyframes ps-drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
      .ps-speedline { animation: ps-speed 2.4s linear infinite; }
      @keyframes ps-speed {
        0% { transform: translate(120px, -60px); opacity: 0; }
        15% { opacity: 0.5; }
        100% { transform: translate(-260px, 160px); opacity: 0; }
      }
      .ps-ember { animation: ps-ember-rise 6s ease-in infinite; }
      @keyframes ps-ember-rise {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 0.7; }
        100% { transform: translateY(-220px); opacity: 0; }
      }

      /* ---- web strand ---- */
      #ps-web-line {
        stroke: rgba(235,240,255,0.55);
        stroke-width: 2.5;
        stroke-dasharray: 6 7;
        fill: none;
        animation: ps-web-pay 1.1s linear infinite;
        filter: drop-shadow(0 0 3px rgba(200,220,255,0.35));
      }
      @keyframes ps-web-pay { to { stroke-dashoffset: -26; } }

      /* ---- hero swing pivot (origin = web anchor point) ---- */
      #ps-hero-pivot { transform-origin: 1360px 60px; animation: ps-swing 1.9s ease-in-out infinite; }
      @keyframes ps-swing {
        0%, 100% { transform: rotate(-13deg); }
        50% { transform: rotate(17deg); }
      }
      #ps-hero-ghost1, #ps-hero-ghost2 {
        transform-origin: 1360px 60px;
        animation: ps-swing 1.9s ease-in-out infinite;
      }
      #ps-hero-ghost1 { animation-delay: 0.09s; opacity: 0.22; filter: blur(2px); }
      #ps-hero-ghost2 { animation-delay: 0.18s; opacity: 0.10; filter: blur(4px); }

      /* ---- falling figure holding loop ---- */
      #ps-falling-group { animation: ps-fall-loop 2.3s ease-in-out infinite; }
      @keyframes ps-fall-loop {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(16px) rotate(3deg); }
      }
      #ps-falling-ghost1, #ps-falling-ghost2 { animation: ps-fall-loop 2.3s ease-in-out infinite; }
      #ps-falling-ghost1 { animation-delay: 0.08s; opacity: 0.20; filter: blur(2px); }
      #ps-falling-ghost2 { animation-delay: 0.16s; opacity: 0.09; filter: blur(4px); }

      .ps-hair { transform-origin: top center; }
      .ps-hair.ps-hair-a { animation: ps-hair-sway 1.6s ease-in-out infinite; }
      .ps-hair.ps-hair-b { animation: ps-hair-sway 1.9s ease-in-out infinite 0.15s; }
      .ps-hair.ps-hair-c { animation: ps-hair-sway 1.4s ease-in-out infinite 0.3s; }
      @keyframes ps-hair-sway {
        0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); }
      }

      /* ---- resolving to success ---- */
      #ps-loader.ps-success #ps-hero-pivot {
        animation: ps-swing-catch 0.85s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      #ps-loader.ps-success #ps-falling-group {
        animation: ps-caught-hold 0.85s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes ps-swing-catch { to { transform: rotate(9deg) translate(-430px, 330px); } }
      @keyframes ps-caught-hold { to { transform: translate(4px, -6px) rotate(0deg); } }
      #ps-loader.ps-success #ps-scene { animation: ps-kenburns-punch 0.85s ease-out forwards; }
      @keyframes ps-kenburns-punch { to { transform: scale(1.14); } }
      #ps-loader.ps-success .ps-ghost,
      #ps-loader.ps-failed .ps-ghost { opacity: 0 !important; transition: opacity 0.2s; }

      /* ---- resolving to failure ---- */
      #ps-loader.ps-failed #ps-hero-pivot {
        animation: ps-swing-miss 0.55s ease-out forwards;
      }
      #ps-loader.ps-failed #ps-falling-group {
        animation: ps-fall-final 1s cubic-bezier(0.55,0,1,0.45) forwards;
      }
      @keyframes ps-swing-miss { to { transform: rotate(-28deg) translate(10px, -14px); } }
      @keyframes ps-fall-final { to { transform: translateY(390px) rotate(55deg); opacity: 0; } }
      #ps-impact-flash {
        position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
      }
      #ps-loader.ps-failed #ps-impact-flash {
        animation: ps-flash 0.5s ease-out 0.95s forwards;
      }
      @keyframes ps-flash {
        0% { opacity: 0; } 12% { opacity: 0.55; } 100% { opacity: 0; }
      }
      #ps-impact-burst { opacity: 0; transform: scale(0.3); transform-origin: center; }
      #ps-loader.ps-failed #ps-impact-burst {
        animation: ps-impact-burst-anim 0.5s ease-out 0.95s forwards;
      }
      @keyframes ps-impact-burst-anim {
        0% { opacity: 0; transform: scale(0.3); }
        55% { opacity: 1; transform: scale(1.2); }
        100% { opacity: 0; transform: scale(1.6); }
      }
      #ps-loader.ps-failed #ps-scene {
        animation: ps-shake 0.5s ease-out 0.95s;
      }
      @keyframes ps-shake {
        0%, 100% { transform: translate(0,0) scale(1.05); }
        20% { transform: translate(-10px, 4px) scale(1.05); }
        40% { transform: translate(8px, -3px) scale(1.05); }
        60% { transform: translate(-6px, 3px) scale(1.05); }
        80% { transform: translate(5px, -2px) scale(1.05); }
      }

      /* ---- captions / HUD text ---- */
      #ps-caption-wrap {
        position: absolute; left: 0; right: 0; bottom: 13%;
        z-index: 4; display: flex; flex-direction: column; align-items: center;
        gap: 0.5rem; padding: 0 1.5rem; text-align: center;
      }
      #ps-caption {
        font-family: 'Oswald', 'Impact', sans-serif;
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
        font-size: clamp(1rem, 2.6vw, 1.5rem);
        color: rgb(243 244 248);
        text-shadow: 0 2px 14px rgba(0,0,0,0.7);
        opacity: 0; animation: ps-caption-cycle 3.3s ease-in-out infinite;
      }
      @keyframes ps-caption-cycle {
        0% { opacity: 0; transform: translateY(6px); }
        10% { opacity: 1; transform: translateY(0); }
        82% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-4px); }
      }
      #ps-hud {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.65rem; letter-spacing: 0.16em; text-transform: uppercase;
        color: rgba(243,244,248,0.55);
      }
      #ps-loader.ps-failed #ps-caption-wrap,
      #ps-loader.ps-success #ps-caption-wrap { display: none; }

      /* ---- failure card ---- */
      #ps-fail-panel {
        position: absolute; left: 50%; top: 50%; z-index: 5;
        transform: translate(-50%, -50%) scale(0.94);
        display: none; flex-direction: column; align-items: center; gap: 0.85rem;
        border: 1px solid rgba(255,60,70,0.5);
        background: rgba(10, 8, 10, 0.82);
        backdrop-filter: blur(6px);
        padding: 1.5rem 2rem; max-width: 360px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        font-family: 'JetBrains Mono', monospace;
        opacity: 0;
        transition: opacity 0.4s ease 1.1s, transform 0.4s ease 1.1s;
      }
      #ps-loader.ps-failed #ps-fail-panel {
        display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1);
      }
      #ps-fail-title {
        color: rgb(255, 70, 80); font-weight: 700; letter-spacing: 0.09em; font-size: 0.9rem;
      }
      #ps-fail-desc { font-size: 0.74rem; opacity: 0.85; line-height: 1.55; text-align: center; }
      #ps-retry {
        margin-top: 0.2rem; padding: 0.6rem 1.6rem;
        background: rgb(230, 36, 41); color: white; border: none;
        font-family: inherit; font-size: 0.72rem; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
        transition: background 0.15s ease;
      }
      #ps-retry:hover { background: rgb(255, 31, 61); }

      @media (max-width: 640px) {
        .ps-bar { height: 12%; }
        #ps-caption-wrap { bottom: 16%; }
      }

      @media (prefers-reduced-motion: reduce) {
        #ps-scene, .ps-window, .ps-cloud, .ps-speedline, .ps-ember,
        #ps-web-line, #ps-hero-pivot, #ps-hero-ghost1, #ps-hero-ghost2,
        #ps-falling-group, #ps-falling-ghost1, #ps-falling-ghost2,
        .ps-hair, #ps-grain, #ps-caption {
          animation: none !important;
        }
        #ps-caption { opacity: 1; }
        #ps-loader.ps-failed #ps-scene { animation: none !important; }
        #ps-loader.ps-failed #ps-impact-burst { animation: none !important; opacity: 1; transform: scale(1); }
        #ps-loader.ps-failed #ps-impact-flash { animation: none !important; opacity: 0; }
      }
    </style>
  </head>
  <body class="bg-void text-web font-sans antialiased selection:bg-spider selection:text-white overflow-x-hidden">
    <div
      id="ps-loader"
      role="status"
      aria-live="polite"
      aria-label="Loading Aryan Singh's portfolio"
    >
      <div id="ps-scene">
        <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="psSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#04050a" />
              <stop offset="55%" stop-color="#0b0e1c" />
              <stop offset="100%" stop-color="#241226" />
            </linearGradient>
            <radialGradient id="psMoon" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#eaf3ff" stop-opacity="0.95" />
              <stop offset="55%" stop-color="#a9c4e6" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#a9c4e6" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="psRedGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#e62429" stop-opacity="0.30" />
              <stop offset="100%" stop-color="#e62429" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="psPurpleGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
              <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="psHeroSuit" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff3b45" />
              <stop offset="100%" stop-color="#8f0e14" />
            </linearGradient>
            <linearGradient id="psHeroCowl" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ff4b53" />
              <stop offset="100%" stop-color="#a3131a" />
            </linearGradient>
            <linearGradient id="psDress" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#dce8ff" />
              <stop offset="100%" stop-color="#5f7bb8" />
            </linearGradient>
            <linearGradient id="psHair" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffd76b" />
              <stop offset="100%" stop-color="#b8862f" />
            </linearGradient>
            <filter id="psGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="4" />
            </filter>
            <filter id="psSoftShadow" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45" />
            </filter>
          </defs>

          <!-- sky -->
          <rect width="1600" height="900" fill="url(#psSky)" />
          <circle cx="240" cy="170" r="120" fill="url(#psMoon)" />
          <circle cx="240" cy="170" r="58" fill="#eef5ff" opacity="0.9" />
          <ellipse class="ps-cloud" cx="420" cy="200" rx="150" ry="18" fill="#0b0e1c" opacity="0.35" filter="url(#psGlow)" />
          <ellipse class="ps-cloud" cx="120" cy="260" rx="110" ry="14" fill="#0b0e1c" opacity="0.3" filter="url(#psGlow)" style="animation-delay:-8s" />

          <!-- ambient rim glows -->
          <circle cx="1300" cy="260" r="260" fill="url(#psRedGlow)" />
          <circle cx="560" cy="620" r="300" fill="url(#psPurpleGlow)" />

          <!-- far skyline -->
          <g opacity="0.55" fill="#0a0c16">
            <polygon points="0,900 0,620 60,620 60,560 130,560 130,640 210,640 210,540 280,540 280,660 360,660 360,600 430,600 430,900" />
            <polygon points="1600,900 1600,600 1520,600 1520,520 1450,520 1450,610 1370,610 1370,540 1300,540 1300,650 1220,650 1220,900" />
          </g>

          <!-- near skyline w/ lit windows -->
          <g fill="#04050a">
            <polygon points="0,900 0,520 90,520 90,430 190,430 190,500 260,500 260,380 350,380 350,480 440,480 440,900" />
            <polygon points="1160,900 1160,470 1240,470 1240,360 1330,360 1330,450 1420,450 1420,400 1520,400 1520,480 1600,480 1600,900" />
          </g>
          <g class="ps-window" fill="#ffd15c">
            <rect x="30" y="560" width="8" height="12" /> <rect x="55" y="560" width="8" height="12" />
            <rect x="110" y="460" width="8" height="12" /> <rect x="150" y="460" width="8" height="12" />
            <rect x="280" y="410" width="8" height="12" style="animation-delay:-1.4s" />
            <rect x="310" y="410" width="8" height="12" style="animation-delay:-2.6s" />
            <rect x="1200" y="500" width="8" height="12" style="animation-delay:-0.6s" />
            <rect x="1260" y="400" width="8" height="12" style="animation-delay:-3.1s" />
            <rect x="1350" y="390" width="8" height="12" style="animation-delay:-1.9s" />
            <rect x="1450" y="430" width="8" height="12" style="animation-delay:-2.2s" />
          </g>

          <!-- ground -->
          <rect x="0" y="860" width="1600" height="40" fill="#020203" />

          <!-- drifting embers / dust for atmosphere -->
          <g fill="#ffb347">
            <circle class="ps-ember" cx="500" cy="780" r="2.5" style="animation-delay:-1s" />
            <circle class="ps-ember" cx="700" cy="800" r="2" style="animation-delay:-3.4s" />
            <circle class="ps-ember" cx="900" cy="760" r="2.2" style="animation-delay:-5s" />
          </g>

          <!-- speed lines selling velocity -->
          <g class="ps-speedline" stroke="rgba(235,240,255,0.5)" stroke-width="2" stroke-linecap="round">
            <line x1="1200" y1="200" x2="1260" y2="240" />
          </g>
          <g class="ps-speedline" stroke="rgba(235,240,255,0.4)" stroke-width="2" stroke-linecap="round" style="animation-delay:-0.8s">
            <line x1="1100" y1="340" x2="1160" y2="380" />
          </g>
          <g class="ps-speedline" stroke="rgba(235,240,255,0.35)" stroke-width="2" stroke-linecap="round" style="animation-delay:-1.6s">
            <line x1="1250" y1="450" x2="1310" y2="490" />
          </g>

          <!-- web anchor + strand -->
          <line id="ps-web-line" x1="1360" y1="0" x2="1360" y2="60" />

          <!-- ===================== FALLING FIGURE ===================== -->
          <g id="ps-falling-ghost2" class="ps-ghost">
            <use href="#psGwenFigure" transform="translate(620 460)" />
          </g>
          <g id="ps-falling-ghost1" class="ps-ghost">
            <use href="#psGwenFigure" transform="translate(620 460)" />

            <use href="#psGwenFigure" transform="translate(620 460)" filter="url(#psSoftShadow)" />

          <!-- ===================== HERO, SWINGING ===================== -->

            <use href="#psHeroFigure" transform="translate(1300 300)" />
          </g>
          <g id="ps-hero-ghost1" class="ps-ghost">
            <use href="#psHeroFigure" transform="translate(1300 300)" />
          </g>
          <g id="ps-hero-pivot">
            <use href="#psHeroFigure" transform="translate(1300 300)" filter="url(#psSoftShadow)" />

          </g>

          <!-- ===================== REUSABLE FIGURE DEFS ===================== -->
          <!-- Wrapped in <defs> so these only render via the <use> refs above,
               not again at their own inline position. -->
          <defs>
          <g id="psHeroFigure" transform="translate(-20 -60)">
            <!-- trailing motion swoosh -->
            <path d="M -6 10 C -70 -10 -120 -30 -160 -60" stroke="url(#psHeroSuit)" stroke-width="10" stroke-linecap="round" opacity="0.35" fill="none" />
            <!-- back leg -->
            <path d="M 6 58 C 22 72 30 90 22 110" stroke="url(#psHeroSuit)" stroke-width="11" stroke-linecap="round" fill="none" />
            <!-- back arm (trailing) -->
            <path d="M 12 34 C 34 44 46 58 44 76" stroke="url(#psHeroSuit)" stroke-width="10" stroke-linecap="round" fill="none" />
            <!-- torso -->
            <path d="M -14 26 C -16 44 -12 58 0 66 C 12 58 16 44 14 26 C 8 18 -8 18 -14 26 Z" fill="url(#psHeroSuit)" />
            <!-- chest emblem (abstract, not a literal logo) -->
            <g stroke="#0e0a0a" stroke-width="1.4" opacity="0.55">
              <line x1="0" y1="30" x2="0" y2="58" /> <line x1="0" y1="34" x2="-9" y2="46" />

    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        var loader = document.getElementById('ps-loader');
        var captionEl = document.getElementById('ps-caption');
        var hudEl = document.getElementById('ps-hud');
        var retryBtn = document.getElementById('ps-retry');
        if (!loader) return;

        var MIN_DISPLAY_MS = 2600;   // let the swing + catch actually read as a sequence
        var READY_TIMEOUT_MS = 12000; // beyond this, treat it as a failed load
        var startedAt = Date.now();
        var settled = false;

        // Bars slide in immediately for the "cinematic mode" frame.
        requestAnimationFrame(function () { loader.classList.add('ps-ready'); });

        var captions = [
          'Closing the distance',
          'Web-line holding',
          'Almost there',
        ];
        var hudLines = [
          '// aryan singh — full stack engineer',
          '// calculating trajectory…',
          '// java · spring boot · react · postgresql',
        ];
        var idx = 0;
        var captionTimer = setInterval(function () {
          idx = (idx + 1) % captions.length;
          if (captionEl) captionEl.textContent = captions[idx];
          if (hudEl) hudEl.textContent = hudLines[idx];
        }, 3300);

        function hideLoader() {
          loader.classList.add('ps-hidden');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 650);
        }

        function succeed() {
          if (settled) return;
          settled = true;
          clearInterval(captionTimer);
          clearTimeout(failTimer);
          var elapsed = Date.now() - startedAt;
          var wait = Math.max(0, MIN_DISPLAY_MS - elapsed);
          setTimeout(function () {
            loader.classList.add('ps-success');
            setTimeout(hideLoader, 950);
          }, wait);
        }

        function fail() {
          if (settled) return;
          settled = true;
          clearInterval(captionTimer);
          loader.classList.add('ps-failed');
        }

        var failTimer = setTimeout(fail, READY_TIMEOUT_MS);

        window.addEventListener('portfolio:app-ready', succeed, { once: true });

        if (retryBtn) {
          retryBtn.addEventListener('click', function () {
            window.location.reload();
          });
        }
      })();
    </script>
