# Runs the backend + its database together. The frontend is a static Vite
# app, meant to be run separately with `npm run dev` (or deployed as a static
# build to Vercel/Netlify) pointed at the backend via VITE_API_BASE_URL.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5432:5432"
    volumes:
      - portfolio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/portfolio
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Contact-form email notifications — optional. Leave SMTP_HOST unset
      # and the backend just logs+skips instead of failing. See README.md.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_TO_EMAIL: ${NOTIFY_TO_EMAIL:-aryansobdh@gmail.com}
      NOTIFY_FROM_EMAIL: ${NOTIFY_FROM_EMAIL:-}
    ports:
      - "8080:8080"

volumes:
  portfolio-db-data:
