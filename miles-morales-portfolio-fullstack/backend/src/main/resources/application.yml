server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Required to read contact messages via GET /api/contact. Leave unset
    # locally to keep that endpoint disabled by default in dev.
    api-key: ${ADMIN_API_KEY:}
  notify:
    # Email notifications on new contact submissions. Both blank by default —
    # EmailService skips sending (and the app still boots fine) unless
    # SMTP_HOST above and this are both set. Names match docker-compose.yml's
    # NOTIFY_TO_EMAIL / NOTIFY_FROM_EMAIL env vars.
    to-email: ${NOTIFY_TO_EMAIL:}
    from-email: ${NOTIFY_FROM_EMAIL:}
