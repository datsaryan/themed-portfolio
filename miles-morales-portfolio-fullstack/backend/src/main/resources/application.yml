server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-backend
  # We define our own JavaMailSender bean in MailConfig.java that always
  # exists (even with a blank host) — see the note in EmailService.java. The
  # built-in autoconfiguration only creates a bean when spring.mail.host
  # resolves to a genuinely-set value, which crashes startup on any deploy
  # that hasn't set SMTP_HOST yet, so it's excluded here.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio}
    password: ${SPRING_DATASOURCE_PASSWORD:portfolio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # SMTP relay used to email the site owner whenever someone submits the
  # contact form. Leave SMTP_HOST unset to run without email notifications —
  # EmailService checks for that and just logs + skips instead of failing
  # the request. See README.md "Contact form email notifications".
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # Required to read contact messages via GET /api/contact. Leave unset
    # locally to keep that endpoint disabled by default in dev.
    api-key: ${ADMIN_API_KEY:}
  notify:
    # Where contact-form submissions get emailed. Defaults to the resume's
    # address; override with NOTIFY_TO_EMAIL if that ever changes.
    to-email: ${NOTIFY_TO_EMAIL:aryansobdh@gmail.com}
    # "From" header on the outgoing mail. Most SMTP providers require this to
    # match (or be a verified alias of) the authenticated SMTP_USERNAME.
    from-email: ${NOTIFY_FROM_EMAIL:${SMTP_USERNAME:}}
