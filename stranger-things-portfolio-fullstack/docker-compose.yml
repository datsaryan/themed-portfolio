version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stranger-things-postgres
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stranger-things-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio_db
      JWT_SECRET: StrangerThingsPortfolioSecretKey2024AryanSinghHawkinsDepartmentOfEnergy
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stranger-things-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
